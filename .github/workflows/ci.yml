name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit + contract + evaluation + moments tests
        run: npx vitest run

      - name: Lint (BLOCKING — brief v5 9.1)
        run: npx eslint . --max-warnings 0
        continue-on-error: false

      - name: Publish test summary
        if: always()
        run: |
          echo "## Test results" >> $GITHUB_STEP_SUMMARY
          echo "- vitest: all unit/contract/evaluation tests" >> $GITHUB_STEP_SUMMARY
