###############################################################################
# Homelab deployment.
#
#   cp .env.example .env      # fill in what you have; everything is optional
#   docker compose up -d --build
#
# Not published on a public port. Reached through the Cloudflare Tunnel with an
# Access policy in front - see docs/DEPLOYMENT.md section 3. Anything that can
# reach this port can spend your API credits and write a vendor API key.
###############################################################################

services:
  app:
    build:
      context: .
      # Bump when caption extraction starts failing; a stale yt-dlp is the most
      # common cause.
      args:
        YTDLP_VERSION: '2025.10.14'
    image: youtube-content-miner:latest
    container_name: content-miner
    restart: unless-stopped

    # Bound to loopback so only the Cloudflare Tunnel on this host can reach it.
    # 8083 follows the local convention (8081 Hub, 8082 redirect). Do not use
    # 3000 - Open WebUI already owns it.
    ports:
      - '127.0.0.1:8083:3000'

    env_file:
      - .env

    environment:
      DATABASE_PATH: /data/content-miner.db
      TZ: ${TZ:-Asia/Jakarta}

    volumes:
      # The clip library and the editor feedback dataset. Back this up.
      - content-miner-data:/data

    # A pipeline run holds a transcript plus scoring batches in memory. This is
    # generous for a single-operator workload and prevents a runaway run from
    # affecting the rest of the homelab.
    deploy:
      resources:
        limits:
          memory: 1G

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  content-miner-data:
