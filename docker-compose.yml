###############################################################################
# Homelab deployment.
#
#   cp .env.example .env      # fill in what you have; everything is optional
#   docker compose up -d --build
#
# The app is intentionally not published on a public port here. Put it behind
# whatever already terminates TLS on your homelab and require authentication
# there - see docs/DEPLOYMENT.md. The application itself has no login, so
# anything that can reach the port can spend your API credits.
###############################################################################

services:
  app:
    build:
      context: .
      # Bump when caption extraction starts failing; a stale yt-dlp is the most
      # common cause.
      args:
        YTDLP_VERSION: '2025.10.14'
    image: youtube-content-miner:latest
    container_name: content-miner
    restart: unless-stopped

    # Bound to loopback so only the reverse proxy on this host can reach it.
    # Change to "3000:3000" only if you know the network is already trusted.
    ports:
      - '127.0.0.1:3000:3000'

    env_file:
      - .env

    environment:
      DATABASE_PATH: /data/content-miner.db
      TZ: ${TZ:-Asia/Jakarta}

    volumes:
      # The clip library and the editor feedback dataset. Back this up.
      - content-miner-data:/data

    # A pipeline run holds a transcript plus scoring batches in memory. This is
    # generous for a single-operator workload and prevents a runaway run from
    # affecting the rest of the homelab.
    deploy:
      resources:
        limits:
          memory: 1G

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  content-miner-data:
